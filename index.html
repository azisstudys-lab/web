<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kalkulator Realtime 10 Input/Output</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .outbox { min-height: 2.5rem; }
  </style>
</head>
<body class="bg-light">

  <div class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h1 class="h4 mb-1">Kalkulator Realtime (10 Baris)</h1>
        <div class="text-muted small">
          Karakter diizinkan: angka, spasi, <span class="mono">* / ( ) + - ^ % . ,</span>
        </div>
      </div>
      <button id="btnClearAll" class="btn btn-outline-danger btn-sm">Clear Semua</button>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div id="rows" class="vstack gap-3"></div>
      </div>
    </div>

    <div class="text-muted small mt-3">
      Tips: kamu bisa menulis seperti <span class="mono">(10+2)*3^2</span> atau <span class="mono">100%30</span>.
    </div>
  </div>

  <script>
    // ===== Utilities =====
    const ALLOWED_RE = /^[0-9\s*\/()+\-^%.,]*$/;  // hanya karakter ini
    const DISPLAY_ERR = (msg) => msg;

    function sanitizeInput(raw) {
      // ubah koma jadi titik untuk desimal (opsional)
      let s = raw.replaceAll(',', '.');

      // buang karakter selain allowed
      // (tetap kita validasi juga; ini "auto-clean")
      s = s.replace(/[^0-9\s*\/()+\-^%.,]/g, '');
      return s;
    }

    function normalizeExpression(expr) {
      // Trim & standar
      let s = expr.trim();

      // ganti ^ jadi ** (pangkat)
      // contoh: 2^3 -> 2**3
      s = s.replaceAll('^', '**');

      return s;
    }

    function safeEvalMath(expr) {
      // Validasi karakter: setelah normalisasi, '^' sudah jadi '**'
      // Jadi allowed char untuk eval jadi: angka, spasi, * / ( ) + - % . dan bintang ganda (**)
      // Pastikan tidak ada huruf / karakter aneh.
      if (!/^[0-9\s*\/()+\-%.*]*$/.test(expr)) {
        throw new Error("Karakter tidak valid.");
      }

      // Cek kurung seimbang sederhana
      let balance = 0;
      for (const ch of expr) {
        if (ch === '(') balance++;
        if (ch === ')') balance--;
        if (balance < 0) throw new Error("Kurung tidak seimbang.");
      }
      if (balance !== 0) throw new Error("Kurung tidak seimbang.");

      // Hindari ekspresi kosong
      if (!expr.trim()) return "";

      // Eval dengan Function (tanpa akses variabel luar)
      // Kita tidak izinkan huruf, jadi tidak bisa memanggil fungsi JS.
      const fn = new Function(`"use strict"; return (${expr});`);
      const val = fn();

      if (typeof val !== "number" || !Number.isFinite(val)) {
        throw new Error("Hasil tidak valid.");
      }

      return val;
    }

    function formatNumber(n) {
      // tampilkan rapi, tapi tidak memaksa locale
      // batasi panjang desimal jika terlalu panjang
      const s = String(n);
      if (s.includes('e') || s.includes('E')) return s; // scientific notation
      const [a, b] = s.split('.');
      if (!b) return a;
      const trimmed = b.slice(0, 12).replace(/0+$/,'');
      return trimmed ? `${a}.${trimmed}` : a;
    }

    async function pasteFromClipboard() {
      if (!navigator.clipboard?.readText) throw new Error("Clipboard API tidak tersedia di browser ini.");
      return await navigator.clipboard.readText();
    }

    async function copyToClipboard(text) {
      if (!navigator.clipboard?.writeText) throw new Error("Clipboard API tidak tersedia di browser ini.");
      await navigator.clipboard.writeText(text);
    }

    function setStatus(el, ok, message) {
      el.textContent = message || "";
      el.classList.toggle("text-danger", !ok);
      el.classList.toggle("text-success", ok);
    }

    // ===== UI Builder =====
    const rowsEl = document.getElementById("rows");

    function buildRow(i) {
      const wrapper = document.createElement("div");
      wrapper.className = "border rounded-3 p-3 bg-white";

      wrapper.innerHTML = `
        <div class="row g-2 align-items-start">
          <div class="col-12 col-lg-6">
            <label class="form-label mb-1">Input #${i}</label>
            <div class="input-group">
              <input type="text" class="form-control mono" placeholder="contoh: (10+2)*3^2"  />
              <button class="btn btn-outline-secondary btnPaste" type="button" title="Paste ke input">Paste</button>
              <button class="btn btn-outline-danger btnClear" type="button" title="Clear baris ini">Clear</button>
            </div>
            <div class="form-text">Hanya angka & operator: <span class="mono">* / ( ) + - ^ %</span></div>
          </div>

          <div class="col-12 col-lg-6">
            <label class="form-label mb-1">Output #${i}</label>
            <div class="d-flex gap-2">
              <div class="flex-grow-1">
                <div class="form-control mono outbox" data-output style="background:#f8f9fa;"></div>
              </div>
              <div class="d-flex flex-column gap-2">
                <button class="btn btn-outline-primary btnCopy" type="button" title="Copy output">Copy</button>
              </div>
            </div>
            <div class="small mt-1" data-status></div>
          </div>
        </div>
      `;

      const input = wrapper.querySelector("input");
      const out = wrapper.querySelector("[data-output]");
      const status = wrapper.querySelector("[data-status]");
      const btnPaste = wrapper.querySelector(".btnPaste");
      const btnCopy = wrapper.querySelector(".btnCopy");
      const btnClear = wrapper.querySelector(".btnClear");

      function recompute() {
        // auto-sanitize + validasi
        const raw = input.value;
        const sanitized = sanitizeInput(raw);

        if (raw !== sanitized) input.value = sanitized;

        if (!ALLOWED_RE.test(sanitized)) {
          out.textContent = "";
          setStatus(status, false, DISPLAY_ERR("Karakter tidak diizinkan."));
          return;
        }

        try {
          const expr = normalizeExpression(sanitized);
          const res = safeEvalMath(expr);

          if (res === "") {
            out.textContent = "";
            setStatus(status, true, "");
            return;
          }

          out.textContent = formatNumber(res);
          setStatus(status, true, "OK");
        } catch (e) {
          out.textContent = "";
          setStatus(status, false, e?.message || "Error");
        }
      }

      input.addEventListener("input", recompute);

      btnClear.addEventListener("click", () => {
        input.value = "";
        recompute();
        input.focus();
      });

      btnPaste.addEventListener("click", async () => {
        try {
          const text = await pasteFromClipboard();
          input.value = sanitizeInput(text);
          recompute();
          input.focus();
          setStatus(status, true, "Paste berhasil");
          setTimeout(() => setStatus(status, true, ""), 1200);
        } catch (e) {
          setStatus(status, false, e?.message || "Gagal paste");
        }
      });

      btnCopy.addEventListener("click", async () => {
        try {
          const text = out.textContent || "";
          if (!text) {
            setStatus(status, false, "Output kosong, tidak ada yang di-copy.");
            return;
          }
          await copyToClipboard(text);
          setStatus(status, true, "Copy berhasil");
          setTimeout(() => setStatus(status, true, ""), 1200);
        } catch (e) {
          setStatus(status, false, e?.message || "Gagal copy");
        }
      });

      // initial
      recompute();

      return wrapper;
    }

    // render 10 rows
    for (let i = 1; i <= 10; i++) {
      rowsEl.appendChild(buildRow(i));
    }

    // Clear all
    document.getElementById("btnClearAll").addEventListener("click", () => {
      rowsEl.querySelectorAll("input").forEach(inp => inp.value = "");
      // trigger recompute by dispatching input
      rowsEl.querySelectorAll("input").forEach(inp => inp.dispatchEvent(new Event("input")));
    });
  </script>
</body>
</html>
