<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kalkulator Realtime 10 Input</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h1 class="h4 m-0">Kalkulator Realtime (10 Input)</h1>
      <button id="clearAll" class="btn btn-outline-secondary btn-sm">Clear semua</button>
    </div>

    <div class="alert alert-info py-2 small">
      Input yang diizinkan: <code>0-9</code> dan <code>* / ( ) + - ^</code>. Spasi juga boleh.
      Pangkat pakai <code>^</code> (contoh: <code>2^3</code>).
    </div>

    <div class="row g-3" id="calcGrid"></div>
  </div>

  <script>
    // Buat 10 pasang input-output
    const grid = document.getElementById('calcGrid');

    for (let i = 1; i <= 10; i++) {
      const col = document.createElement('div');
      col.className = 'col-12';

      col.innerHTML = `
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="row g-2 align-items-center">
              <div class="col-12 col-lg-6">
                <label class="form-label mb-1">Input ${i}</label>
                <input
                  type="text"
                  class="form-control expr-input"
                  placeholder="Contoh: (10+2)*3^2"
                  inputmode="numeric"
                  autocomplete="off"
                  spellcheck="false"
                  data-index="${i}"
                />
                <div class="form-text text-danger d-none" id="err-${i}">Karakter tidak valid.</div>
              </div>

              <div class="col-12 col-lg-6">
                <label class="form-label mb-1">Output ${i}</label>
                <div class="input-group">
                  <input type="text" class="form-control bg-white expr-output" id="out-${i}" readonly value="" />
                  <button class="btn btn-outline-primary copy-btn" type="button" data-copy="#out-${i}">Copy</button>
                </div>
                <div class="form-text" id="hint-${i}"></div>
              </div>
            </div>
          </div>
        </div>
      `;
      grid.appendChild(col);
    }

    const ALLOWED = /^[0-9+\-*/^()\s.]*$/; // hanya angka, operator, kurung, spasi, titik (desimal)
    const inputs = document.querySelectorAll('.expr-input');

    function safeEval(expr) {
      // Konversi ^ menjadi ** untuk pangkat
      const jsExpr = expr.replace(/\^/g, '**');

      // Evaluasi expression (karena sudah difilter ketat)
      // Tetap bungkus dengan Function agar tidak mengakses scope lain
      return Function('"use strict"; return (' + jsExpr + ')')();
    }

    function formatNumber(n) {
      // Format ringkas; kalau besar/desimal panjang tetap terbaca
      if (!Number.isFinite(n)) return String(n);
      // Hilangkan -0
      if (Object.is(n, -0)) n = 0;
      return String(n);
    }

    function computeFor(inputEl) {
      const idx = inputEl.dataset.index;
      const outEl = document.getElementById(`out-${idx}`);
      const errEl = document.getElementById(`err-${idx}`);
      const hintEl = document.getElementById(`hint-${idx}`);

      let raw = inputEl.value;

      // Filter karakter yang tidak valid (langsung dibersihkan)
      const cleaned = raw.replace(/[^0-9+\-*/^()\s.]/g, '');
      if (cleaned !== raw) {
        inputEl.value = cleaned;
        raw = cleaned;
      }

      // Validasi: hanya allowed
      if (!ALLOWED.test(raw)) {
        errEl.classList.remove('d-none');
        outEl.value = '';
        hintEl.textContent = '';
        return;
      } else {
        errEl.classList.add('d-none');
      }

      const expr = raw.trim();
      if (!expr) {
        outEl.value = '';
        hintEl.textContent = '';
        return;
      }

      try {
        const result = safeEval(expr);
        outEl.value = formatNumber(result);
        hintEl.textContent = '';
      } catch (e) {
        outEl.value = '';
        hintEl.textContent = 'Ekspresi belum valid / belum lengkap.';
      }
    }

    inputs.forEach(el => {
      // realtime hitung
      el.addEventListener('input', () => computeFor(el));

      // cegah karakter selain yang diizinkan saat mengetik (lebih nyaman)
      el.addEventListener('beforeinput', (ev) => {
        if (!ev.data) return; // backspace, delete, dll
        if (!ALLOWED.test(ev.data)) ev.preventDefault();
      });

      // hitung awal (kalau ada value)
      computeFor(el);
    });

    // Tombol copy output
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('.copy-btn');
      if (!btn) return;

      const sel = btn.getAttribute('data-copy');
      const out = document.querySelector(sel);
      const text = out?.value ?? '';

      try {
        await navigator.clipboard.writeText(text);
        const old = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => (btn.textContent = old), 900);
      } catch {
        // fallback: select + execCommand
        out.focus();
        out.select();
        document.execCommand('copy');
        const old = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => (btn.textContent = old), 900);
      }
    });

    // Clear semua
    document.getElementById('clearAll').addEventListener('click', () => {
      inputs.forEach(el => { el.value = ''; computeFor(el); });
    });
  </script>
</body>
</html>
