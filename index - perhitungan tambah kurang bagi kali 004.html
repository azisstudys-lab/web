<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kalkulator Real-time (10 Input/Output)</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h1 class="h4 m-0">Kalkulator Real-time (10 buah)</h1>
      <span class="badge text-bg-secondary">Operator: +  −  ×  ÷  ( )  ^  %</span>
    </div>

    <div class="alert alert-info small mb-4">
      Contoh: <code>(10+2)*3</code>, <code>2^5</code>, <code>200*10%</code>, <code>(50%+0.2)*100</code><br/>
      Catatan: <code>^</code> = pangkat, dan <code>10%</code> diperlakukan sebagai <code>0.1</code>.
    </div>

    <div id="calcList" class="row g-3"></div>
  </div>

  <script>
    // ====== Helpers ======

    // Ubah ekspresi agar bisa dihitung JS:
    // - '^' -> '**' (pangkat)
    // - 'angka%' -> '(angka/100)'
    // - sanitasi karakter yang diperbolehkan
    function normalizeExpression(raw) {
      let expr = (raw ?? "").trim();

      if (!expr) return "";

      // Batasi karakter yang diperbolehkan (angka, spasi, . , operator, kurung, persen, ^)
      // Jika ada karakter lain, langsung dianggap invalid.
      const allowed = /^[0-9+\-*/().^%\s]+$/;
      if (!allowed.test(expr)) throw new Error("Karakter tidak valid");

      // Ganti '^' jadi '**'
      expr = expr.replace(/\^/g, "**");

      // Tangani persen: "12%" => "(12/100)"
      // Ini menangani angka desimal juga: "12.5%"
      expr = expr.replace(/(\d+(?:\.\d+)?)\s*%/g, "($1/100)");

      // Rapikan spasi
      expr = expr.replace(/\s+/g, " ");

      return expr;
    }

    function tryEvaluate(raw) {
      const expr = normalizeExpression(raw);

      if (!expr) return { ok: true, value: "" };

      // Evaluasi dengan Function (setelah disanitasi ketat).
      // Pakai "use strict" agar lebih aman.
      const fn = new Function('"use strict"; return (' + expr + ');');
      const val = fn();

      if (typeof val !== "number" || !Number.isFinite(val)) {
        return { ok: false, value: "Error" };
      }

      // Format hasil (bisa kamu ubah sesuai selera)
      const formatted = new Intl.NumberFormat("id-ID", {
        maximumFractionDigits: 12
      }).format(val);

      return { ok: true, value: formatted };
    }

    // ====== UI builder ======
    const calcList = document.getElementById("calcList");

    function makeCalcCard(i) {
      const col = document.createElement("div");
      col.className = "col-12 col-lg-6";

      col.innerHTML = `
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <div class="fw-semibold">Kalkulator #${i}</div>
              <button class="btn btn-sm btn-outline-secondary" type="button" data-action="clear" data-index="${i}">
                Clear
              </button>
            </div>

            <label class="form-label small text-muted mb-1" for="expr-${i}">Input</label>
            <input
              id="expr-${i}"
              class="form-control"
              type="text"
              inputmode="text"
              placeholder="Misal: (10+2)*3, 2^5, 200*10%"
              data-role="expr"
              data-index="${i}"
              autocomplete="off"
            />

            <div class="mt-3">
              <label class="form-label small text-muted mb-1" for="out-${i}">Output (real-time)</label>
              <input
                id="out-${i}"
                class="form-control"
                type="text"
                data-role="out"
                data-index="${i}"
                readonly
                placeholder="Hasil akan muncul di sini"
              />
              <div class="form-text" id="hint-${i}"></div>
            </div>
          </div>
        </div>
      `;
      return col;
    }

    // Buat 10 buah
    for (let i = 1; i <= 10; i++) {
      calcList.appendChild(makeCalcCard(i));
    }

    function setHint(i, text, type) {
      const hint = document.getElementById(`hint-${i}`);
      hint.textContent = text || "";
      hint.className = "form-text " + (type === "error" ? "text-danger" : "text-muted");
    }

    function updateResult(i, raw) {
      const out = document.getElementById(`out-${i}`);
      try {
        const res = tryEvaluate(raw);
        if (res.ok) {
          out.value = res.value;
          setHint(i, raw.trim() ? "OK" : "", raw.trim() ? "ok" : "ok");
        } else {
          out.value = res.value;
          setHint(i, "Ekspresi tidak valid / hasil tidak terdefinisi", "error");
        }
      } catch (e) {
        out.value = "Error";
        setHint(i, e.message || "Ekspresi tidak valid", "error");
      }
    }

    // Event delegation: input real-time + tombol clear
    document.addEventListener("input", (e) => {
      const el = e.target;
      if (el?.dataset?.role === "expr") {
        const i = Number(el.dataset.index);
        updateResult(i, el.value);
      }
    });

    document.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-action='clear']");
      if (!btn) return;
      const i = Number(btn.dataset.index);
      const expr = document.getElementById(`expr-${i}`);
      const out = document.getElementById(`out-${i}`);
      expr.value = "";
      out.value = "";
      setHint(i, "", "ok");
      expr.focus();
    });
  </script>
</body>
</html>
