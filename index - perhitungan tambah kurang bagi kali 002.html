<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kalkulator Ekspresi 10 Baris (Real-time)</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .result-box {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .muted-small { font-size: .85rem; opacity: .8; }
  </style>
</head>

<body class="bg-light">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
              <div>
                <h1 class="h4 mb-1">Kalkulator Ekspresi Real-time (10 Baris)</h1>
                <div class="text-secondary muted-small">
                  Contoh: <span class="mono">(10 + 2) * 3 / 4 - 1</span>
                </div>
              </div>

              <div class="d-flex gap-2">
                <button id="btnFillDemo" class="btn btn-outline-primary btn-sm">Isi Contoh</button>
                <button id="btnClearAll" class="btn btn-outline-danger btn-sm">Reset</button>
              </div>
            </div>

            <div class="alert alert-info py-2 mb-3">
              Karakter yang didukung: <span class="mono">0-9</span>, <span class="mono">.</span>, spasi,
              <span class="mono">+</span> <span class="mono">-</span> <span class="mono">*</span> <span class="mono">/</span>,
              <span class="mono">( )</span>
            </div>

            <div id="rows" class="vstack gap-3"></div>

            <div class="mt-3 text-secondary muted-small">
              Tips: gunakan <span class="mono">*</span> untuk kali, <span class="mono">/</span> untuk bagi. Kurung bisa bersarang.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ====== Konfigurasi ======
    const TOTAL_ROWS = 10;

    // Validasi karakter aman: angka, spasi, titik, operator + - * /, kurung
    const SAFE_EXPR_REGEX = /^[0-9+\-*/().\s]*$/;

    // ====== Helper: evaluasi ekspresi dengan validasi ======
    function evaluateExpression(expr) {
      const trimmed = expr.trim();
      if (trimmed === "") return { ok: true, value: "" };

      if (!SAFE_EXPR_REGEX.test(trimmed)) {
        return { ok: false, error: "Karakter tidak valid" };
      }

      // Cegah beberapa pola yang sering bikin kacau (opsional, tapi membantu)
      // Misal operator ganda yang tidak umum seperti "**" atau "//" sudah otomatis gagal karena regex? Tidak, regex mengizinkan,
      // tapi kita bisa deteksi sederhana:
      if (trimmed.includes("**") || trimmed.includes("//")) {
        return { ok: false, error: "Operator tidak didukung" };
      }

      try {
        // Gunakan Function untuk evaluasi (setelah whitelist karakter).
        // Bungkus dengan "use strict" dan return.
        const fn = new Function('"use strict"; return (' + trimmed + ');');
        const result = fn();

        if (typeof result !== "number" || !Number.isFinite(result)) {
          return { ok: false, error: "Hasil tidak valid" };
        }
        return { ok: true, value: result };
      } catch (e) {
        return { ok: false, error: "Error" };
      }
    }

    function formatNumber(n) {
      // Format ringkas (kalau mau selalu 2 desimal, ganti di sini)
      // Hindari 1.0000000002 akibat floating point:
      const fixed = Math.round((n + Number.EPSILON) * 1e12) / 1e12;
      return fixed.toString();
    }

    // ====== UI builder ======
    function createRow(index) {
      const row = document.createElement("div");
      row.className = "row g-2 align-items-center";

      row.innerHTML = `
        <div class="col-12 col-md-6">
          <label class="form-label mb-1">Input ${index + 1}</label>
          <div class="input-group">
            <span class="input-group-text mono">f(x)</span>
            <input
              type="text"
              class="form-control mono expr-input"
              placeholder="contoh: (10 + 2) * 3 / 4 - 1"
              data-index="${index}"
              autocomplete="off"
              inputmode="text"
            />
          </div>
          <div class="form-text">Gunakan: + - * / ( )</div>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label mb-1">Output ${index + 1}</label>
          <div class="border rounded px-3 py-2 bg-white result-box">
            <div class="mono result-text" data-index="${index}"></div>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-secondary btn-sm copy-btn" type="button" data-index="${index}">Copy</button>
              <button class="btn btn-outline-secondary btn-sm clear-btn" type="button" data-index="${index}">Clear</button>
            </div>
          </div>
          <div class="form-text text-secondary">Real-time saat mengetik.</div>
        </div>
      `;
      return row;
    }

    function updateResult(i, expr) {
      const outputEl = document.querySelector(`.result-text[data-index="${i}"]`);
      const evalRes = evaluateExpression(expr);

      if (evalRes.ok) {
        if (evalRes.value === "") {
          outputEl.textContent = "";
          outputEl.classList.remove("text-danger");
          outputEl.classList.add("text-secondary");
        } else {
          outputEl.textContent = formatNumber(evalRes.value);
          outputEl.classList.remove("text-danger", "text-secondary");
        }
      } else {
        outputEl.textContent = evalRes.error;
        outputEl.classList.add("text-danger");
      }
    }

    function wireEvents() {
      // Input real-time
      document.querySelectorAll(".expr-input").forEach((inp) => {
        inp.addEventListener("input", (e) => {
          const i = Number(e.target.dataset.index);
          updateResult(i, e.target.value);
        });
      });

      // Clear per baris
      document.querySelectorAll(".clear-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = Number(btn.dataset.index);
          const inp = document.querySelector(`.expr-input[data-index="${i}"]`);
          inp.value = "";
          updateResult(i, "");
          inp.focus();
        });
      });

      // Copy output
      document.querySelectorAll(".copy-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const i = Number(btn.dataset.index);
          const out = document.querySelector(`.result-text[data-index="${i}"]`).textContent;
          try {
            await navigator.clipboard.writeText(out);
            btn.textContent = "Copied!";
            setTimeout(() => (btn.textContent = "Copy"), 900);
          } catch {
            btn.textContent = "Gagal";
            setTimeout(() => (btn.textContent = "Copy"), 900);
          }
        });
      });

      // Reset semua
      document.getElementById("btnClearAll").addEventListener("click", () => {
        document.querySelectorAll(".expr-input").forEach((inp, idx) => {
          inp.value = "";
          updateResult(idx, "");
        });
      });

      // Isi demo
      document.getElementById("btnFillDemo").addEventListener("click", () => {
        const demos = [
          "(10 + 2) * 3",
          "100 / (5 + 5)",
          "7 + 8 * 2",
          "(7 + 8) * 2",
          "50 - 3 * (4 + 2)",
          "12.5 * 4 - 10 / 2",
          "((3 + 2) * (8 - 5)) / 3",
          "1 + 2 + 3 + 4 + 5",
          "99 / 3 + (6 * 7)",
          "(200 - 50) / (2 + 3)"
        ];
        document.querySelectorAll(".expr-input").forEach((inp, idx) => {
          inp.value = demos[idx] ?? "";
          updateResult(idx, inp.value);
        });
      });
    }

    // ====== Init ======
    (function init() {
      const rowsEl = document.getElementById("rows");
      for (let i = 0; i < TOTAL_ROWS; i++) {
        rowsEl.appendChild(createRow(i));
      }
      // set output default state
      for (let i = 0; i < TOTAL_ROWS; i++) updateResult(i, "");
      wireEvents();
    })();
  </script>
</body>
</html>
