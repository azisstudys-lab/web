<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Contoh Baca Attribute</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="index.js" defer></script>
</head>
<body>
  <!-- contoh atribut biasa dan data-attribute -->

          data-id="42"
          data-nama="Produk A"
          data-harga="150000"
          role="action">
    Tambah
  </button>
</body>
</html>
